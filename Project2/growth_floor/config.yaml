# All tunable settings live here. Paths are relative to the repo root (growth_floor/).
data:
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/raw/MANIFEST.json
  # Raw French files, keyed by source id. `required: false` files are skipped (with a note) if absent.
  sources:
    ff3_daily:   {file: F-F_Research_Data_Factors_daily.csv, required: true}
    ff3_monthly: {file: F-F_Research_Data_Factors.csv, required: true}
    ind10_daily: {file: 10_Industry_Portfolios_Daily.csv, required: false}
  # Risk-free series: daily RF for wealth accounting, monthly RF for rf_ann.
  rf:
    daily:   {source: ff3_daily, column: RF}
    monthly: {source: ff3_monthly, column: RF}
  assets:
    us_mkt: {source: ff3_daily, column: Mkt-RF, add_rf: true,
             monthly_check: {source: ff3_monthly, column: Mkt-RF, add_rf: true}}
    ind_nodur: {source: ind10_daily, section: value_weighted, column: NoDur, add_rf: false}
    ind_durbl: {source: ind10_daily, section: value_weighted, column: Durbl, add_rf: false}
    ind_manuf: {source: ind10_daily, section: value_weighted, column: Manuf, add_rf: false}
    ind_enrgy: {source: ind10_daily, section: value_weighted, column: Enrgy, add_rf: false}
    ind_hitec: {source: ind10_daily, section: value_weighted, column: HiTec, add_rf: false}
    ind_telcm: {source: ind10_daily, section: value_weighted, column: Telcm, add_rf: false}
    ind_shops: {source: ind10_daily, section: value_weighted, column: Shops, add_rf: false}
    ind_hlth:  {source: ind10_daily, section: value_weighted, column: Hlth,  add_rf: false}
    ind_utils: {source: ind10_daily, section: value_weighted, column: Utils, add_rf: false}
    ind_other: {source: ind10_daily, section: value_weighted, column: Other, add_rf: false}

trading_days_per_year: 252

estimation:
  start_date: null    # null = first available
  end_date: null      # null = last available
  robustness_start_dates: ["1963-07-01", "1990-01-01"]   # tested in Spec 02
  # Automatic fallback window (DECISIONS.md 2026-11-21). The base model is first fitted on the full history;
  # if it is near-integrated or its parameter draws are mostly invalid, ALL equity estimation for that asset
  # (fits, refits, states, premium, PIT, VaR) uses data from fallback_start. The rate model always uses the
  # full rf history.
  fallback_start: "1990-01-01"
  fallback_rule:
    max_persistence: 0.998            # trigger if persistence >= this
    min_draw_valid_share: 0.70        # trigger if share of valid parameter draws < this

checks:
  report_dir: reports/data_check
  coverage:
    min_days_per_year: 240
    max_days_per_year: 260
    saturday_trading_last_year: 1952    # Saturday sessions are expected up to and including this year
    # Out-of-band years with a verified explanation (reported, not flagged). Verify against the data before adding.
    explained_years:
      1968: "NYSE closed on Wednesdays Jun-Dec 1968 (paperwork crisis); verified: 0-1 Wednesday sessions/month Jun-Dec in the data"
  dates:
    gap_report_days: 4        # list every gap longer than this many calendar days
    gap_warn_days: 14         # WARN if any gap exceeds this
  missing:
    max_nan_share_fail: 0.01  # FAIL if more than this share of rows is missing in r or rf
  units:
    max_abs_median: 0.005
    min_std: 0.003
    max_std: 0.05
  extremes:
    top_n: 20
    expected_dates: ["1987-10-19"]   # each must appear in the top-N |r| table, else WARN
    expected_months: ["2020-03"]     # at least one day of each month must appear, else WARN
    suspicious_abs_return: 0.25
  monthly_crosscheck:
    flag_abs_diff: 0.005          # flag months with |daily-compounded - monthly| above this
    max_flag_share_fail: 0.05     # FAIL if more than this share of months is flagged
  rf:
    # Flag months where |prod(1+rf_d)-1 - rf_m| exceeds the rounding bound n_days*resolution/2 plus this tolerance.
    tolerance_beyond_rounding: 0.0001   # 1 bp per month
  summary:
    window_days: [252, 504]       # cumulative-return windows (≈1y, ≈2y)
    loss_threshold: -0.05         # share of windows with cumulative return below this
  figures:
    rolling_vol_days: 63
    rolling_return_days: 252
    hist_bins: 200
    dpi: 120

# ----------------------------------------------------------------------------- Spec 02
model:
  seed: 20261120
  results_dir: results/model
  report_dir: reports/model
  base: gjr_t                         # garch_n | garch_t | gjr_t | egarch_t (chosen by BIC + PIT, see DECISIONS)
  comparison: [garch_n, garch_t, gjr_t, egarch_t]
  scale: 100                          # arch is fitted on scale * x
  innovations: t                      # t | fhs (filtered historical simulation)
  premium:
    mode: constant_arith              # constant_arith | prop_variance | constant_sharpe
    annual_excess: estimate           # 'estimate' or a number, e.g. 0.04
    shrink_to: 0.0                    # shrinkage target for the estimate
    shrink_weight: 0.5                # 0 = raw sample mean, 1 = target
  gaps:
    flag_calendar_days: 4             # returns after a gap > this many calendar days are multi-day returns
    variants: [none, scale]           # none = as is; scale = divide by sqrt(Mon-Fri days spanned)
    base_variant: scale               # chosen 2026-11-20: +4.8 loglik (Jacobian-adjusted), PIT unchanged (see DECISIONS)
  expanding:
    min_obs: 2520                     # first refit uses 10 years
    refit_every: 252
  rolling:
    window: 5040                      # 20 years
    step: 252
  subsamples:                         # [label, start, end]
    - [pre-1963, null, "1962-12-31"]
    - [1963-1999, "1963-01-01", "1999-12-31"]
    - [2000-end, "2000-01-01", null]
  robustness_start_dates: ["1952-07-01", "1963-07-01", "1990-01-01"]
  n_param_draws: 200
  nu_min: 2.5

rate:
  mode: vasicek                       # vasicek | constant
  start_date: "1954-01-01"            # after the 1951 Treasury-Fed Accord
  end_date: null
  floor_at_zero: false
  corr_alignment: same_month          # same_month | prev_month (equity-rate innovation pairing)
  pit_min_months: 60                  # expanding rate fits in the PIT test need this many months

states:
  named_percentiles: {calm: 10, normal: 50, elevated: 90, crisis: 99, extreme: max}
  rate_grid: [0.0, 0.02, 0.05]
  dense_sigma_grid: [0.08, 0.10, 0.12, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.65, 0.80]
  dense_cap_mult: 1.1                 # clip dense grid at historical max sigma x this
  anchor_dates: ["2006-12-29", "1987-10-16", "1987-10-19", "2008-10-10", "2008-11-20",
                 "2020-03-16", "2022-06-16", "latest"]
  secondary_descriptors: {realised_vol_days: 63, drawdown_days: 252}

validation:
  pit:
    horizons: [252, 504]
    n_paths: 2000
    start_month_step: 3               # quarterly grid: first trading day of every 3rd month
    levels: [0.01, 0.02, 0.05, 0.10]
    # sigma_0 buckets (percentile edges of the asset's own full-sample filtered sigma history)
    buckets: {calm: [0, 30], normal: [30, 70], elevated: [70, 95], crisis: [95, 100]}
    bucket_groups: {high: [elevated, crisis]}   # pooled for power
    min_n_eff_verdict: 8                        # below this many independent windows: 'inconclusive'
    eras: [[pre-1952, null, "1951-12-31"], [1952-1999, "1952-01-01", "1999-12-31"], [2000-, "2000-01-01", null]]
    ci_level: 0.95
  stylised:
    n_paths: 40
    acf_lags: 100
    window_step: 21                   # start every 21 days for windowed drawdown stats
  var:
    levels: [0.01, 0.001]
  crash:
    state_date: "1987-10-16"
    one_day_loss: 0.17
    shock_date: "1987-10-19"

# ----------------------------------------------------------------------------- Spec 03
problem:
  W0: 100000000.0
  K: 95000000.0
  gamma: 2.0
  breach_target: 0.02
  horizons_days: [252, 315, 378, 441, 504]     # T = 1.0, 1.25, 1.5, 1.75, 2.0 years

engine:
  history_days: 63            # ring buffer of past returns exposed to strategies (read-only)
  gap_min_sigmas: 1.0         # 'gap' if the crossing-day equity move exceeded a cushion worth >= this many conditional sds
  locked_phi: 0.01            # 'locked in cash': phi below this for each of the last locked_days days
  locked_days: 21
  rebalance_every: 1          # days between rebalances (weights drift in between)
  sigma_cap_mult: 1.5         # simulated (DGP) conditional vol capped at 1.5 x the asset's historical max filtered sigma

strategies:
  default_set: [cash, merton_const, merton_vol, cppi, cppi_vol, obpi_merton]
  knobs:                      # bounds and search spacing for tuning; direction +1: larger = more aggressive
    cppi:        {name: m,     lo: 1.0,  hi: 60.0,  spacing: log, direction: 1,  default: 5.0}
    cppi_vol:    {name: z,     lo: 0.5,  hi: 200.0, spacing: log, direction: -1, default: 6.0}
    obpi_merton: {name: K_eff, lo: 0.80, hi: 1.10,  spacing: lin, direction: -1, default: 1.0, relative_to_K: true}
  floor:                      # floor protected by cppi / cppi_vol / obpi (engine accounting always uses the spec F_t)
    mode: robust              # robust: K x exp(-(alpha-quantile of log cash growth under the investor's Vasicek)); spec: F_t
    alpha: 0.001               # 0.1% (tightened from 0.5% at the 2026-11-21 gate; see DECISIONS)
  obpi_vol_input: conditional # sigma0_fixed | conditional (main run); the other is shown in the frontier sweep
  dp_policy_dir: results/policies

tune:
  target_breach: 0.0125       # buffer below 2% (was 1.5%; tightened at the 2026-11-21 gate: tune/eval gap under fhs)
  selection: logistic         # logistic-in-knob fit over the refinement bracket, solved for the target (grid: last candidate under it)
  n_paths: 20000
  n_paths_quick: 5000
  n_paths_industries: 10000   # industries: robust tuning at 10k paths (runtime), us_mkt at n_paths
  grid_points: 10             # candidates per refinement pass
  passes: 2
  robust_set: [base, dgp_garch_t, fhs, param_unc, persistent]   # robust tuning: max breach across these <= target
                              # (fat_tails excluded: nu = 3 rejected by the daily VaR backtest, scripts/02b_var_backtest.py)
  modes: [uniform, uniform_all, state]   # uniform excludes the 'extreme' state; uniform_all includes it
  state_tune_sigma: dense_and_named      # us_mkt: dense sigma grid + named states (at median r0); industries: named
  results_dir: results/tuned

mc:
  master_seed: 20261121
  n_paths: 50000
  n_paths_quick: 5000
  n_paths_industries: 20000   # industries evaluated at 20k (us_mkt at n_paths)
  n_jobs: -1                  # joblib: all cores
  bootstrap_reps: 200         # CE bootstrap SE
  terminal_subsample: 5000
  sample_paths: 200
  path_stride: 2              # record sample paths / fan quantiles every k days
  fan_subsample: 5000         # pointwise quantiles over the first k paths
  fan_quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
  terminal_quantiles: [0.005, 0.01, 0.02, 0.05, 0.25, 0.5, 0.75, 0.95]
  results_dir: results/mc
  frontier_points: 10
  frontier_n_paths: 20000      # frontier sweeps (diagnostic picture) use fewer paths, same evaluation seed
  scenarios:
    base: {}
    mu_low: {premium_mult: 0.5}
    mu_zero: {premium_mult: 0.0}
    premium_prop_var: {premium_mode: prop_variance}
    fat_tails: {nu_shift: -3, nu_min: 3}
    persistent: {persistence_add: 0.01, persistence_cap: 0.995}
    param_unc: {param_draws: true}
    fhs: {innovations: fhs}
    jump: {jump_prob_per_year: 0.01, jump_return: -0.20}
    rate_const: {rate_mode: constant}
    dgp_garch_t: {alt_model: garch_t}
    dgp_egarch_t: {alt_model: egarch_t}
    rho_zero: {rho: 0.0}
  worst_case_set: [base, dgp_garch_t, fhs, param_unc, persistent]    # = tune.robust_set
  stress_set: [fat_tails, jump, mu_low, mu_zero]                     # reported, outside tuning / worst case
  # compute plan (per the 2026-11-21 budget): dense grid only for base + dgp_garch_t; all horizons only for base
  plan:
    us_mkt:
      base: {states: all, horizons: all, frontier: true}
      dgp_garch_t: {states: all, horizons: [252, 504]}
      other: {scenarios: [mu_low, mu_zero, premium_prop_var, fat_tails, persistent, param_unc, fhs, jump,
                          rate_const, dgp_egarch_t, rho_zero], states: named, horizons: [252, 504]}
    industries:
      scenarios: [base, dgp_garch_t, fhs, jump]
      states: named
      horizons: [252, 504]

backtest:
  refit_every_days: 1260      # expanding refit every 5 years
  min_obs: 2520
  start_step: monthly
  knob_mode: state            # state-dependent knob function from results/tuned (also runs uniform)
  results_dir: results/backtest
  buckets: {calm: [0, 30], normal: [30, 70], elevated: [70, 95], crisis: [95, 100]}   # expanding percentiles

# ----------------------------------------------------------------------------- Spec 04 (DP policy)
dp:
  results_dir: results_dp      # dp_policy evaluation rows (same schema as results/mc); the app merges it with results/
  policy_dir: results/policies # dp_{asset}.npz (policy tables + lam* lookup), dp_{asset}_J.npz, cache/
  compare_results_dir: ../growth_floor/results   # SPEC 03 full run (read only) for the V6 / scorecard comparison
  n_jobs: 2                    # CPU budget for SPEC 04 (2 cores)
  chunk_h: 4
  tau_max: 504                 # one backward solve covers every T <= 2y and every sigma_0
  r0: median                   # rate held at the median r0 inside the DP (other r0: further work)
  y_grid:                      # 120 points, log-uniform within bands; dense where the policy jumps (DECISIONS)
    bands: {edges: [0.3, 0.9, 0.97, 1.0, 1.08, 1.3, 4.0], counts: [22, 10, 14, 34, 15, 24]}
  h_grid: {n: 40, lo_mult_calm: 0.5}    # sigma from 0.5 x calm sigma_0 to the SPEC 03 variance cap
  quad_nodes: 60
  interp_h: pchip              # monotone cubic in log h (linear needs ~2x the h points for the same CE)
  interp_y: pchip              # monotone cubic in log y (linear in log h); 'linear' = spec bilinear (diffusive, DECISIONS)
  phi_points: 41
  lam_grid: [0.0, 1.0e-4, 1.92e-4, 3.68e-4, 7.07e-4, 1.36e-3, 2.61e-3, 5.0e-3]   # 0 + geomspace(1e-4, 5e-3, 7); scan in DECISIONS
  calib:
    n_paths: 20000             # = tune.n_paths (SPEC 03 robust tuning, tuning seed)
    n_paths_industries: 10000  # = tune.n_paths_industries
    horizons: [252, 504]
    robust_set_industries: [base, dgp_garch_t, fhs]
  eval:
    horizons: [252, 504]
    scenarios_us_mkt: [base, dgp_garch_t, fhs, param_unc, persistent, fat_tails, jump, mu_low, mu_zero]
    scenarios_industries: [base, dgp_garch_t, fhs]
  validation:
    v5_grid_tol: 0.001         # 0.1 pp grid tolerance on top of 2.58 binomial SEs
